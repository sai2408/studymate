# StudyMate - whole app with one command:  docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/studymate.db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-the-env-file}
      FRONTEND_URL: http://localhost:3000,http://localhost:5173
    volumes:
      - studymate-data:/app/data        # database survives container restarts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000   # the BROWSER calls the API, so use localhost
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  studymate-data: